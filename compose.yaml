services:
  web:
    image: ghcr.io/cedar2025/xboard:latest
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
      - ./plugins/SubFetcher/resources/assets:/www/public/plugins/sub-fetcher:ro
    environment:
      - docker=true
    depends_on:
      - redis
    # network_mode: host
    command: php artisan octane:start --host=0.0.0.0 --port=7001 --workers=2 --max-requests=500
    restart: on-failure
    ports:
      - 7001:7001
  horizon:
    image: ghcr.io/cedar2025/xboard:latest
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./plugins:/www/plugins
    restart: on-failure
    # network_mode: host
    command: php artisan horizon
    depends_on:
      - redis
  ws-server:
    image: ghcr.io/cedar2025/xboard:latest
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./plugins:/www/plugins
    # network_mode: host
    command: php artisan ws-server start
    depends_on:
      - redis
    restart: on-failure
    ports:
      - 8076:8076
  redis:
    image: redis:8-alpine
    command: redis-server --save 900 1 --save 300 10 --save 60 10000
    restart: unless-stopped
    volumes:
      - redis-data:/data
  sub-fetcher:
    image: 1154761334/sub-fetcher:latest
    volumes:
      - ./sub-fetcher/index.html:/app/public/index.html:ro
    network_mode: host
    restart: unless-stopped
    depends_on:
      - web
volumes:
  redis-data:
